<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro's Epic Japan Road Trip 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.02); }
    </style>
</head>
<body class="antialiased p-4 md:p-8">

    <header class="max-w-4xl mx-auto mb-8 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 uppercase tracking-wide"><span class="gradient-text">Japan</span> 2026</h1>
        <p class="text-gray-400 text-lg">30 May - 7 Jun | 3 Pax | Kanto ➔ Chubu</p>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div class="glass-panel p-4 rounded-xl text-center hover-scale">
                <span class="block text-2xl font-bold text-blue-400">9</span>
                <span class="text-xs text-gray-400 uppercase">Days</span>
            </div>
            <div class="glass-panel p-4 rounded-xl text-center hover-scale">
                <span class="block text-2xl font-bold text-green-400">1,000+</span>
                <span class="text-xs text-gray-400 uppercase">KM Driven</span>
            </div>
            <div class="glass-panel p-4 rounded-xl text-center hover-scale">
                <span class="block text-2xl font-bold text-purple-400">Corolla</span>
                <span class="text-xs text-gray-400 uppercase">Wagon Hybrid</span>
            </div>
            <div class="glass-panel p-4 rounded-xl text-center hover-scale">
                <span class="block text-2xl font-bold text-red-400">Tabata</span>
                <span class="text-xs text-gray-400 uppercase">Basecamp</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <div class="flex overflow-x-auto space-x-2 pb-4 mb-4 snap-x custom-scrollbar" id="tabs">
            </div>

        <div id="content-area" class="glass-panel rounded-2xl p-6 shadow-2xl transition-all duration-300">
            </div>
    </main>

    <script>
        const tripData = [
            {
                day: "Day 1", date: "30 May", title: "The Beginning (NRT ➔ Nikko)",
                route: "Narita Airport ➔ Nikko",
                sleep: "Nikko",
                visualLink: "https://www.google.com/search?tbm=isch&q=Nikko+Toshogu+Shrine+Shinkyo+Bridge+summer",
                activities: [
                    "รับรถ Toyota Rent a Car (Terminal 1 North Wing)",
                    "ยิงยาวขึ้นทางด่วนเข้า Nikko (แวะพัก Michi-no-Eki กลางทาง)",
                    "เดินเล่นศาลเจ้า Toshogu หรือโซนสะพานแดง Shinkyo"
                ],
                navi: [
                    { name: "Toyota Rent a Car NRT", code: "Phone: 0476-32-1020" },
                    { name: "Toshogu Shrine", code: "Mapcode: 267 122 361*33" }
                ],
                food: "🥢 Yuba Soba (โซบะฟองเต้าหู้) & Yuba Croquette"
            },
            {
                day: "Day 2", date: "31 May", title: "Mountain Cruising (Nikko ➔ Matsumoto)",
                route: "Nikko ➔ Matsumoto",
                sleep: "Airbnb @ Matsumoto",
                visualLink: "https://www.google.com/search?tbm=isch&q=Matsumoto+Castle+Japan",
                activities: [
                    "ขับรถข้ามเขา ทะลุ Japan Romantic Road",
                    "ถึง Matsumoto ช่วงบ่าย/เย็น Check-in Airbnb",
                    "เดินเล่นรอบปราสาท Matsumoto (มัตสึโมโต้) ตอนเย็น"
                ],
                navi: [
                    { name: "Matsumoto Castle", code: "Mapcode: 75 861 462*26" },
                    { name: "Sanzoku-yaki Zone", code: "Phone: 0263-32-2902" }
                ],
                food: "🍗 Sanzoku-yaki (ไก่ทอดโจรภูเขาชิ้นยักษ์) แกล้มเบียร์"
            },
            {
                day: "Day 3", date: "1 Jun", title: "Into the Alps (Kamikochi)",
                route: "Matsumoto ➔ Sawando ➔ Kamikochi",
                sleep: "Hotel @ Kamikochi",
                visualLink: "https://www.google.com/search?tbm=isch&q=Kamikochi+Kappa+Bridge+summer",
                activities: [
                    "ทิ้งกระเป๋าใหญ่ไว้ Airbnb จัดแค่เป้เล็ก",
                    "เอารถไปจอดลาน Sawando Parking",
                    "นั่ง Taxi เหมา หรือ Bus เข้าอุทยาน Kamikochi",
                    "เดินป่าโซนสะพาน Kappa-bashi ➔ Taisho Pond"
                ],
                navi: [
                    { name: "Sawando Parking (จอดรถ)", code: "Mapcode: 406 312 878*85" }
                ],
                food: "🥧 Apple Pie อบใหม่ที่ Trois Cinq & อาหารโรงแรม"
            },
            {
                day: "Day 4", date: "2 Jun", title: "Alps Retreat (Kamikochi ➔ Matsumoto)",
                route: "Kamikochi ➔ Matsumoto",
                sleep: "Airbnb @ Matsumoto",
                visualLink: "https://www.google.com/search?tbm=isch&q=Nawate+Street+Matsumoto",
                activities: [
                    "ตื่นเช้าสูดอากาศ ถ่ายรูปสะพาน Kappa-bashi แบบไร้ผู้คน",
                    "สายๆ นั่งบัส/แท็กซี่ กลับมาเอารถที่ Sawando",
                    "ขับกลับเข้าเมือง Matsumoto ช้อปปิ้งถนนกบ (Nawate Street)"
                ],
                navi: [
                    { name: "Matsumoto City Center", code: "Mapcode: 75 861 345*11" }
                ],
                food: "🍜 Shinshu Soba (โซบะเส้นสดทำมือ)"
            },
            {
                day: "Day 5", date: "3 Jun", title: "The Snow Wall (Tateyama ➔ Hakuba)",
                route: "Matsumoto ➔ Ogizawa ➔ Murodo ➔ Hakuba",
                sleep: "Hakuba",
                visualLink: "https://www.google.com/search?tbm=isch&q=Yuki-no-Otani+Snow+Wall+Japan+June",
                activities: [
                    "08:00 ขับรถไป Ogizawa จอดรถที่ลานแบบเสียตังค์",
                    "10:00 นั่งบัสไฟฟ้าขึ้นเขื่อน Kurobe ทะลุไป Murodo",
                    "ถ่ายรูป Yuki-no-Otani (กำแพงหิมะ)",
                    "15:00 นั่งกลับลงมาเอารถ ขับไป Hakuba"
                ],
                navi: [
                    { name: "Ogizawa Station (จอดรถ)", code: "Mapcode: 695 125 101*55" },
                    { name: "Kurobe Dam (จุดแวะ)", code: "Use Web Ticket QR Code" }
                ],
                food: "🍛 Kurobe Dam Curry & 🥩 Shinshu Beef Yakiniku (Hakuba)"
            },
            {
                day: "Day 6", date: "4 Jun", title: "The Long Drive (Hakuba ➔ Tokyo)",
                route: "Hakuba ➔ Tokyo (Nishi-Nippori)",
                sleep: "Hotel @ Tabata",
                visualLink: "https://www.google.com/search?tbm=isch&q=Hakuba+Mountain+Harbor",
                activities: [
                    "เช้าขึ้นกระเช้าไป Hakuba Mountain Harbor ดูวิวพาโนรามา",
                    "13:00 ยิงยาวเข้าโตเกียว (ล้อต้องหมุน!)",
                    "Drop เพื่อนและกระเป๋าที่โรงแรม Tabata",
                    "ขับไปคืนรถที่ Nishi-Nippori ก่อน 20:00 น."
                ],
                navi: [
                    { name: "Hakuba Mountain Harbor", code: "Phone: 0261-72-3150" },
                    { name: "Toyota Rent a Car (N-Nippori)", code: "Phone: 03-3823-0100" }
                ],
                food: "🥐 กาแฟ City Bakery (Hakuba) & ของเสียบไม้แถว Tabata"
            },
            {
                day: "Day 7", date: "5 Jun", title: "The Magic Kingdom (Disney)",
                route: "Tabata ➔ Maihama (Disneyland)",
                sleep: "Hotel @ Tabata",
                visualLink: "https://www.google.com/search?tbm=isch&q=Tokyo+Disneyland+Castle+parade",
                activities: [
                    "นั่งรถไฟไป Tokyo Station ต่อสาย Keiyo Line ลง Maihama",
                    "ลุย Disneyland แบบเต็มสตรีม (กด DPA รัวๆ)",
                    "ดูพาเหรดและพลุปิดท้าย"
                ],
                navi: [
                    { name: "Public Transport", code: "ใช้ Suica/Pasmo แตะผ่าน" }
                ],
                food: "🍗 Smoked Turkey Leg & 🍡 Alien Mochi"
            },
            {
                day: "Day 8", date: "6 Jun", title: "Otaku & Shopping (Tokyo)",
                route: "Tabata ➔ Harajuku/Tokyo Station",
                sleep: "Hotel @ Tabata",
                visualLink: "https://www.google.com/search?tbm=isch&q=Chiikawa+Land+Tokyo",
                activities: [
                    "ลุย Chiikawa Land (ต้องจองคิว LivePocket ล่วงหน้า)",
                    "ละลายทรัพย์ช้อปปิ้งของฝาก",
                    "แพ็คกระเป๋ายัดของเตรียมกลับ"
                ],
                navi: [
                    { name: "Train System", code: "Yamanote Line is your friend" }
                ],
                food: "🍣 ซูเปอร์มาร์เก็ตป้ายเหลืองลด 50% แถว Tabata"
            },
            {
                day: "Day 9", date: "7 Jun", title: "Game Over (Return)",
                route: "Tabata ➔ Nippori ➔ Narita Airport",
                sleep: "Home Sweet Home",
                visualLink: "https://www.google.com/search?tbm=isch&q=Keisei+Skyliner",
                activities: [
                    "ตื่นสายๆ เช็คเอาท์",
                    "นั่งรถไฟ 1 ป้ายไป Nippori ต่อ Keisei Skyliner (40 นาที)",
                    "ถึงสนามบิน 12:30 รอขึ้นเครื่อง ZIPAIR รอบ 15:00"
                ],
                navi: [
                    { name: "Keisei Skyliner", code: "จองตั๋วออนไลน์/ซื้อตู้" }
                ],
                food: "🍱 เบนโตะสถานีรถไฟ (Ekiben) ขากลับ"
            }
        ];

        const tabsContainer = document.getElementById('tabs');
        const contentArea = document.getElementById('content-area');

        function renderContent(dayIndex) {
            const data = tripData[dayIndex];
            
            // Render Navis/Mapcodes
            const naviHTML = data.navi.map(n => `
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                    <span class="text-sm text-slate-300">${n.name}</span>
                    <span class="text-sm font-mono text-emerald-400 bg-slate-900 px-2 py-1 rounded shadow-inner">${n.code}</span>
                </div>
            `).join('');

            // Render Activities
            const activitiesHTML = data.activities.map(a => `
                <li class="flex items-start mb-3">
                    <span class="text-sky-400 mr-2 mt-0.5">⚡</span>
                    <span class="text-slate-200">${a}</span>
                </li>
            `).join('');

            contentArea.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b border-slate-700 pb-5 gap-4">
                    <div>
                        <span class="text-sky-400 font-bold tracking-wider uppercase text-sm bg-sky-900/30 px-2 py-1 rounded">${data.date}</span>
                        <h2 class="text-2xl md:text-3xl font-bold mt-2 text-white">${data.title}</h2>
                    </div>
                    <div class="flex flex-col items-end gap-2 w-full md:w-auto">
                        <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-600 font-medium">
                            🛌 ${data.sleep}
                        </span>
                        <a href="${data.visualLink}" target="_blank" rel="noopener noreferrer" 
                           class="w-full md:w-auto text-center bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center gap-2">
                            📸 ส่องรูปสถานที่จริง
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-slate-800/40 p-5 rounded-xl border border-slate-700/50">
                        <h3 class="text-lg font-semibold mb-4 text-indigo-300 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Mission / Plan
                        </h3>
                        <ul class="text-sm">
                            ${activitiesHTML}
                        </ul>
                    </div>

                    <div class="bg-slate-800/40 p-5 rounded-xl border border-slate-700/50">
                        <h3 class="text-lg font-semibold mb-4 text-sky-300 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            GPS & Navigation
                        </h3>
                        <div class="space-y-3 mb-2">
                            ${naviHTML}
                            <p class="text-xs text-slate-400 mt-3 bg-slate-900/50 p-2 rounded border border-slate-700">
                                💡 ทริค: GPS ญี่ปุ่นพิมพ์ "เบอร์โทรศัพท์" ลงไปเลย แม่นกว่าพิมพ์ชื่อภาษาอังกฤษ 100%
                            </p>
                        </div>
                    </div>
                </div>

                <div class="mt-6 bg-gradient-to-r from-amber-900/20 to-orange-900/20 p-5 rounded-xl border border-amber-700/30">
                    <h3 class="text-lg font-semibold mb-2 text-amber-400 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"></path></svg>
                        Target Food
                    </h3>
                    <p class="text-slate-200 font-medium">${data.food}</p>
                </div>
            `;

            // Update tab styles
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx === dayIndex) {
                    btn.classList.add('bg-sky-600', 'text-white', 'border-sky-500', 'shadow-lg', 'shadow-sky-500/20');
                    btn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');
                } else {
                    btn.classList.remove('bg-sky-600', 'text-white', 'border-sky-500', 'shadow-lg', 'shadow-sky-500/20');
                    btn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
                }
            });
        }

        // Initialize Tabs
        tripData.forEach((data, index) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn snap-center whitespace-nowrap px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-sm font-semibold transition-all duration-200 hover:bg-slate-700';
            btn.innerText = data.day;
            btn.onclick = () => renderContent(index);
            tabsContainer.appendChild(btn);
        });

        // Load Day 1 by default
        renderContent(0);
    </script>
</body>
</html>
