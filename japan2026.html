<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro's Trip CMS Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
        .weather-widget { background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2)); }
        input, textarea { background-color: rgba(15, 23, 42, 0.8); border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 4px; width: 100%; font-size: 0.875rem; }
        input:focus, textarea:focus { outline: none; border-color: #38bdf8; ring: 1px; ring-color: #38bdf8; }
        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .fab-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .fab-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="antialiased p-4 md:p-8 pb-24">

    <header class="max-w-4xl mx-auto mb-8 text-center" id="header-display">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 uppercase tracking-wide"><span class="gradient-text" id="disp-main-title">Alpine Sun-Seeker</span> 2026</h1>
        <p class="text-gray-400 text-lg" id="disp-main-desc">30 May - 7 Jun | 3 Pax | Nirasaki ➔ Alps ➔ Tokyo</p>
    </header>

    <header class="max-w-4xl mx-auto mb-8 text-center hidden" id="header-edit">
        <div class="glass-panel p-4 rounded-xl border-dashed border-2 border-sky-500">
            <label class="text-xs text-sky-400 block text-left mb-1">Main Title</label>
            <input type="text" id="edit-main-title" class="mb-2 font-bold text-xl">
            <label class="text-xs text-sky-400 block text-left mb-1">Sub Description</label>
            <input type="text" id="edit-main-desc">
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <div class="flex overflow-x-auto space-x-2 pb-4 mb-4 snap-x" id="tabs"></div>
        <div id="content-area" class="glass-panel rounded-2xl p-6 shadow-2xl transition-all duration-300"></div>
    </main>

    <div class="fab-container">
        <button id="btn-export" class="fab-btn bg-emerald-600 text-white" title="Export JSON Code">💾</button>
        <button id="btn-edit" class="fab-btn bg-blue-600 text-white" title="Toggle Edit Mode">⚙️</button>
    </div>

    <script>
        // 1. Default Data (ถ้ายังไม่มีใน LocalStorage จะดึงอันนี้มาใช้)
        const defaultTripMeta = { title: "Alpine Sun-Seeker", desc: "30 May - 7 Jun | 3 Pax | Nirasaki ➔ Alps ➔ Tokyo" };
        const defaultTripData = [
            {
                day: "Day 1", date: "30 May", title: "NRT ➔ The Sunset V.I.P.", route: "Narita Airport ➔ Nirasaki", sleep: "日の沈み、また昇る (Nirasaki)",
                weather: { temp: "18-25°C", icon: "☀️", desc: "ฟ้าโปร่ง ลุ้นวิวฟูจิยามเย็น" }, ootd: "เสื้อยืด + กางเกงชิโน่ (เตรียมเสื้อคลุมจิบเบียร์)",
                visualLink: "https://www.google.com/search?tbm=isch&q=Kofu+Basin+night+view+Fuji",
                activities: ["รับรถ Toyota Rent NRT ➔ ยิงยาวทางด่วน Chuo Expwy", "Koshu Yumekouji: แวะกินข้าวเที่ยง", "Check-in: เข้าที่พัก Nirasaki", "Moonbathing: นอนดูเงาภูเขาอาบแสงจันทร์"],
                navi: [{ name: "Toyota NRT T1", code: "0476-32-1020" }, { name: "Nirasaki Airbnb", code: "0551-22-1111" }],
                food: "🥢 Koshu Houtou & ไวน์ยามานาชิ", isArtDay: false
            },
            {
                day: "Day 2", date: "31 May", title: "Agile Art Exploration", route: "Nirasaki ➔ Hokuto ➔ Matsumoto", sleep: "Airbnb @ Matsumoto",
                weather: { temp: "15-23°C", icon: "🎨", desc: "Check weather first!" }, ootd: "เสื้อเชิ้ตโอเวอร์ไซส์ ถ่ายรูปแนว Architecture",
                visualLink: "https://www.google.com/search?tbm=isch&q=Kiyoharu+Art+Colony+Tadao+Ando",
                activities: ["Agile Choice: แดดดีไป Kiyosato Terrace / เมฆเยอะไป Shosenkyo", "Kiyoharu Art Colony: เสพงานสถาปัตยกรรม Tadao Ando", "Mishakaike Pond: บึงน้ำมรกตกระจกสะท้อนป่า"],
                navi: [{ name: "Kiyoharu Art Colony", code: "161 582 866*60" }, { name: "Mishakaike Pond", code: "218 695 643*22" }],
                food: "🍗 Sanzoku-yaki แกล้มเบียร์ท้องถิ่น", isArtDay: true
            },
            {
                day: "Day 7", date: "5 Jun", title: "Cute Overload (Chiikawa Land)", route: "Tabata ➔ Tokyo Station ➔ Harajuku", sleep: "Hotel @ Tabata",
                weather: { temp: "18-26°C", icon: "💖", desc: "ระวังฝนปรอยโตเกียว" }, ootd: "ชุดเดินเมืองเน้นคล่องตัว พร้อมแบกถุงช้อปปิ้ง",
                visualLink: "https://www.google.com/search?tbm=isch&q=Chiikawa+Land+Tokyo+Station",
                activities: ["Chiikawa Land: ลุย Tokyo Character Street", "Harajuku: เดินชิล Takeshita Street", "City Chill: หาคาเฟ่เก๋ๆ นั่งเช็ค Backlog งาน"],
                navi: [{ name: "Tokyo Station", code: "Character Street B1" }],
                food: "🥞 แพนเค้กนุ่มฟู & 🍛 ข้าวแกงกะหรี่หอมๆ", isArtDay: false
            }
        ]; // (ตัดทอนให้เห็นภาพว่าเพิ่มลดข้อมูลเองได้เลย)

        // 2. State Management
        let tripMeta = JSON.parse(localStorage.getItem('broTripMeta')) || defaultTripMeta;
        let tripData = JSON.parse(localStorage.getItem('broTripData')) || defaultTripData;
        let isEditMode = false;
        let currentDayIndex = 0;

        const tabsContainer = document.getElementById('tabs');
        const contentArea = document.getElementById('content-area');

        // 3. Render Header
        function renderHeader() {
            if (isEditMode) {
                document.getElementById('header-display').classList.add('hidden');
                document.getElementById('header-edit').classList.remove('hidden');
                document.getElementById('edit-main-title').value = tripMeta.title;
                document.getElementById('edit-main-desc').value = tripMeta.desc;
            } else {
                document.getElementById('header-display').classList.remove('hidden');
                document.getElementById('header-edit').classList.add('hidden');
                document.getElementById('disp-main-title').innerText = tripMeta.title;
                document.getElementById('disp-main-desc').innerText = tripMeta.desc;
            }
        }

        // 4. Update Data Before Switch/Save
        function saveCurrentView() {
            if (!isEditMode) return;
            
            // Save Header
            tripMeta.title = document.getElementById('edit-main-title').value;
            tripMeta.desc = document.getElementById('edit-main-desc').value;

            // Save Current Day Content
            const data = tripData[currentDayIndex];
            data.title = document.getElementById('e-title').value;
            data.date = document.getElementById('e-date').value;
            data.sleep = document.getElementById('e-sleep').value;
            data.weather.icon = document.getElementById('e-w-icon').value;
            data.weather.temp = document.getElementById('e-w-temp').value;
            data.weather.desc = document.getElementById('e-w-desc').value;
            data.ootd = document.getElementById('e-ootd').value;
            data.food = document.getElementById('e-food').value;

            // Save Missions
            const missionInputs = document.querySelectorAll('.e-mission');
            data.activities = Array.from(missionInputs).map(inp => inp.value).filter(val => val.trim() !== "");

            // Save Mapcodes
            const naviNames = document.querySelectorAll('.e-n-name');
            const naviCodes = document.querySelectorAll('.e-n-code');
            data.navi = [];
            for (let i = 0; i < naviNames.length; i++) {
                if (naviNames[i].value.trim() !== "") {
                    data.navi.push({ name: naviNames[i].value, code: naviCodes[i].value });
                }
            }

            localStorage.setItem('broTripMeta', JSON.stringify(tripMeta));
            localStorage.setItem('broTripData', JSON.stringify(tripData));
        }

        // 5. Render Core Content
        function renderContent(dayIndex) {
            currentDayIndex = dayIndex;
            const data = tripData[dayIndex];

            // --- READ MODE ---
            if (!isEditMode) {
                const naviHTML = data.navi.map(n => `
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                        <span class="text-sm text-slate-300">${n.name}</span>
                        <span class="text-sm font-mono text-emerald-400 bg-slate-900 px-2 py-1 rounded shadow-inner">${n.code}</span>
                    </div>
                `).join('');

                const activitiesHTML = data.activities.map(a => `
                    <li class="flex items-start mb-3"><span class="text-sky-400 mr-2 mt-0.5">⚡</span><span class="text-slate-200">${a}</span></li>
                `).join('');

                contentArea.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b border-slate-700 pb-5 gap-4">
                        <div>
                            <span class="text-sky-400 font-bold tracking-wider uppercase text-sm bg-sky-900/30 px-2 py-1 rounded">${data.date}</span>
                            <h2 class="text-2xl md:text-3xl font-bold mt-2 text-white">${data.title}</h2>
                        </div>
                        <div class="flex flex-col items-end gap-2 w-full md:w-auto">
                            <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-600 font-medium">🛌 ${data.sleep}</span>
                        </div>
                    </div>
                    <div class="weather-widget rounded-xl p-4 mb-6 border border-sky-500/30 flex flex-col md:flex-row items-center gap-4">
                        <div class="flex items-center gap-3 md:border-r md:border-sky-500/30 md:pr-4">
                            <span class="text-4xl">${data.weather.icon}</span>
                            <div><p class="text-xl font-bold text-white">${data.weather.temp}</p><p class="text-xs text-sky-200">${data.weather.desc}</p></div>
                        </div>
                        <div class="w-full md:w-auto"><p class="text-sm text-sky-100"><span class="font-bold text-sky-300">👗 OOTD:</span> ${data.ootd}</p></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-slate-800/40 p-5 rounded-xl border border-slate-700/50">
                            <h3 class="text-lg font-semibold mb-4 text-indigo-300 flex items-center">⚡ Mission / Plan</h3>
                            <ul class="text-sm">${activitiesHTML}</ul>
                        </div>
                        <div class="bg-slate-800/40 p-5 rounded-xl border border-slate-700/50">
                            <h3 class="text-lg font-semibold mb-4 text-sky-300 flex items-center">📍 GPS / Code</h3>
                            <div class="space-y-3">${naviHTML}</div>
                        </div>
                    </div>
                    <div class="mt-6 bg-gradient-to-r from-amber-900/20 to-orange-900/20 p-5 rounded-xl border border-amber-700/30">
                        <h3 class="text-lg font-semibold mb-2 text-amber-400">😋 Target Food</h3>
                        <p class="text-slate-200 font-medium">${data.food}</p>
                    </div>
                `;
            } 
            // --- EDIT MODE ---
            else {
                const activitiesEdit = data.activities.map((a, i) => `
                    <div class="flex gap-2 mb-2">
                        <input type="text" class="e-mission" value="${a}">
                        <button onclick="removeMission(${i})" class="bg-red-500 hover:bg-red-600 px-3 rounded text-white text-xs">🗑️</button>
                    </div>
                `).join('');

                const naviEdit = data.navi.map((n, i) => `
                    <div class="flex gap-2 mb-2">
                        <input type="text" class="e-n-name w-1/2" value="${n.name}" placeholder="Place Name">
                        <input type="text" class="e-n-code w-1/2" value="${n.code}" placeholder="Mapcode/Tel">
                        <button onclick="removeNavi(${i})" class="bg-red-500 hover:bg-red-600 px-3 rounded text-white text-xs">🗑️</button>
                    </div>
                `).join('');

                contentArea.innerHTML = `
                    <div class="border-2 border-dashed border-sky-500 p-4 rounded-xl bg-slate-800/50">
                        <h3 class="text-sky-400 font-bold mb-4">🛠️ EDIT MODE ACTIVE (Day ${currentDayIndex + 1})</h3>
                        
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div><label class="text-xs text-gray-400">Title</label><input type="text" id="e-title" value="${data.title}"></div>
                            <div><label class="text-xs text-gray-400">Date</label><input type="text" id="e-date" value="${data.date}"></div>
                            <div class="col-span-2"><label class="text-xs text-gray-400">Sleep (ที่พัก)</label><input type="text" id="e-sleep" value="${data.sleep}"></div>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-4 bg-slate-900 p-3 rounded">
                            <div><label class="text-xs text-gray-400">Icon</label><input type="text" id="e-w-icon" value="${data.weather.icon}"></div>
                            <div><label class="text-xs text-gray-400">Temp</label><input type="text" id="e-w-temp" value="${data.weather.temp}"></div>
                            <div><label class="text-xs text-gray-400">Desc</label><input type="text" id="e-w-desc" value="${data.weather.desc}"></div>
                        </div>

                        <div class="mb-4"><label class="text-xs text-gray-400">OOTD</label><input type="text" id="e-ootd" value="${data.ootd}"></div>
                        <div class="mb-6"><label class="text-xs text-gray-400">Target Food</label><input type="text" id="e-food" value="${data.food}"></div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-slate-900 p-3 rounded border border-slate-700">
                                <label class="text-sm font-bold text-indigo-300 mb-2 block">Missions</label>
                                <div id="edit-missions-list">${activitiesEdit}</div>
                                <button onclick="addMission()" class="mt-2 text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded w-full">+ Add Mission</button>
                            </div>
                            <div class="bg-slate-900 p-3 rounded border border-slate-700">
                                <label class="text-sm font-bold text-sky-300 mb-2 block">GPS / Mapcode</label>
                                <div id="edit-navi-list">${naviEdit}</div>
                                <button onclick="addNavi()" class="mt-2 text-xs bg-sky-600 hover:bg-sky-500 px-3 py-1 rounded w-full">+ Add GPS</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Update Tabs UI
            tabsContainer.innerHTML = '';
            tripData.forEach((d, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn snap-center whitespace-nowrap px-5 py-2.5 rounded-xl border text-sm font-semibold transition-all ${idx === dayIndex ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`;
                btn.innerText = d.day;
                btn.onclick = () => {
                    if (isEditMode) saveCurrentView(); // Auto-save before switching tabs
                    renderContent(idx);
                };
                tabsContainer.appendChild(btn);
            });
        }

        // 6. Action Functions for Lists (เพิ่ม/ลบ Bullet)
        window.addMission = () => { saveCurrentView(); tripData[currentDayIndex].activities.push("New Item"); renderContent(currentDayIndex); }
        window.removeMission = (idx) => { saveCurrentView(); tripData[currentDayIndex].activities.splice(idx, 1); renderContent(currentDayIndex); }
        window.addNavi = () => { saveCurrentView(); tripData[currentDayIndex].navi.push({name:"", code:""}); renderContent(currentDayIndex); }
        window.removeNavi = (idx) => { saveCurrentView(); tripData[currentDayIndex].navi.splice(idx, 1); renderContent(currentDayIndex); }

        // 7. Toggle Edit Mode Button
        document.getElementById('btn-edit').addEventListener('click', () => {
            if (isEditMode) {
                saveCurrentView(); // Save on exit edit mode
                document.getElementById('btn-edit').innerText = "⚙️";
                document.getElementById('btn-edit').classList.replace('bg-pink-600', 'bg-blue-600');
            } else {
                document.getElementById('btn-edit').innerText = "💾";
                document.getElementById('btn-edit').classList.replace('bg-blue-600', 'bg-pink-600');
            }
            isEditMode = !isEditMode;
            renderHeader();
            renderContent(currentDayIndex);
        });

        // 8. Export JSON to Update Hardcode
        document.getElementById('btn-export').addEventListener('click', () => {
            saveCurrentView();
            const exportText = `const defaultTripMeta = ${JSON.stringify(tripMeta, null, 2)};\nconst defaultTripData = ${JSON.stringify(tripData, null, 2)};`;
            navigator.clipboard.writeText(exportText).then(() => {
                alert("✅ ก๊อปปี้ข้อมูล Trip Data ชุดใหม่ลง Clipboard แล้ว!\nเอาไปวางทับโค้ดก้อนเดิมในไฟล์ HTML เพื่ออัปเดตแบบถาวรได้เลย");
            });
        });

        // Initial Load
        renderHeader();
        renderContent(0);
    </script>
</body>
</html>
