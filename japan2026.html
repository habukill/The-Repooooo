        input, textarea { background-color: rgba(15, 23, 42, 0.8); border: 1px solid #475569; color: white; padding: 6px 10px; border-radius: 6px; width: 100%; font-size: 0.875rem; transition: all 0.2s; }

        .fab-btn:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); }
        .art-tag { background-color: #ec4899; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; display: inline-block; }

        // 2. State Management (โหลดจาก Local ถ้ามี ไม่งั้นใช้ Default)
        let tripMeta = JSON.parse(localStorage.getItem('broTripMeta')) || defaultTripMeta;
        let tripData = JSON.parse(localStorage.getItem('broTripData')) || defaultTripData;
        let isEditMode = false;
        let currentDayIndex = 0;

        const tabsContainer = document.getElementById('tabs');
        const contentArea = document.getElementById('content-area');

        // 3. Render Header
        function renderHeader() {
            if (isEditMode) {
                document.getElementById('header-display').classList.add('hidden');
                document.getElementById('header-edit').classList.remove('hidden');
                document.getElementById('edit-main-title').value = tripMeta.title;
                document.getElementById('edit-main-desc').value = tripMeta.desc;
            } else {
                document.getElementById('header-display').classList.remove('hidden');
                document.getElementById('header-edit').classList.add('hidden');
                document.getElementById('disp-main-title').innerText = tripMeta.title;
                document.getElementById('disp-main-desc').innerText = tripMeta.desc;
            }
        }

        // 4. Save Current Form Data to Memory
        function saveCurrentView() {
            if (!isEditMode) return;
            
            tripMeta.title = document.getElementById('edit-main-title').value;
            tripMeta.desc = document.getElementById('edit-main-desc').value;

            const data = tripData[currentDayIndex];
            data.title = document.getElementById('e-title').value;
            data.date = document.getElementById('e-date').value;
            data.sleep = document.getElementById('e-sleep').value;
            data.weather.icon = document.getElementById('e-w-icon').value;
            data.weather.temp = document.getElementById('e-w-temp').value;
            data.weather.desc = document.getElementById('e-w-desc').value;
            data.ootd = document.getElementById('e-ootd').value;
            data.food = document.getElementById('e-food').value;

            const missionInputs = document.querySelectorAll('.e-mission');
            data.activities = Array.from(missionInputs).map(inp => inp.value).filter(val => val.trim() !== "");

            const naviNames = document.querySelectorAll('.e-n-name');
            const naviCodes = document.querySelectorAll('.e-n-code');
            data.navi = [];
            for (let i = 0; i < naviNames.length; i++) {
                if (naviNames[i].value.trim() !== "") {
                    data.navi.push({ name: naviNames[i].value, code: naviCodes[i].value });
                }
            }

            localStorage.setItem('broTripMeta', JSON.stringify(tripMeta));
            localStorage.setItem('broTripData', JSON.stringify(tripData));
        }

                        <span class="text-sm font-mono text-emerald-400 bg-slate-900 px-2 py-1 rounded shadow-inner border border-slate-800">${n.code}</span>
                    </div>
                `).join('');

                    <li class="flex items-start mb-3 group">

                                Mission / Plan
                            </h3>
                            <ul class="text-sm">${activitiesHTML}</ul>
                        </div>
                        <div class="bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50 shadow-inner">
                            <h3 class="text-lg font-semibold mb-5 text-sky-300 flex items-center gap-2 border-b border-slate-700 pb-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                GPS & Navigation
                            </h3>
                            <div class="space-y-3">${naviHTML}</div>
                        </div>
                    </div>

                    <div class="mt-8 bg-gradient-to-r from-amber-900/30 to-orange-900/30 p-6 rounded-2xl border border-amber-700/40 shadow-lg">
                        <h3 class="text-lg font-semibold mb-3 text-amber-400 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"></path></svg>
                            Target Food
                        </h3>
                        <p class="text-slate-200 font-medium text-lg">${data.food}</p>
                    </div>
                `;
            } 
            // --- EDIT MODE ---
            else {
                const activitiesEdit = data.activities.map((a, i) => `
                    <div class="flex gap-2 mb-3">
                        <input type="text" class="e-mission" value="${a}">
                        <button onclick="removeMission(${i})" class="bg-red-500 hover:bg-red-600 px-4 rounded-lg text-white font-bold transition-colors">🗑️</button>
                    </div>
                `).join('');

                const naviEdit = data.navi.map((n, i) => `
                    <div class="flex gap-2 mb-3">
                        <input type="text" class="e-n-name w-1/2" value="${n.name}" placeholder="Place Name">
                        <input type="text" class="e-n-code w-1/2" value="${n.code}" placeholder="Mapcode/Tel">
                        <button onclick="removeNavi(${i})" class="bg-red-500 hover:bg-red-600 px-4 rounded-lg text-white font-bold transition-colors">🗑️</button>
                    </div>
                `).join('');

                contentArea.innerHTML = `
                    <div class="border-2 border-dashed border-sky-500 p-6 rounded-2xl bg-slate-800/90 relative">
                        <div class="absolute -top-4 left-6 bg-sky-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-lg">
                            🛠️ EDITING: Day ${currentDayIndex + 1}
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4 mb-6">
                            <div><label class="text-xs text-sky-300 font-semibold mb-1 block">Title</label><input type="text" id="e-title" value="${data.title}" class="font-bold"></div>
                            <div><label class="text-xs text-sky-300 font-semibold mb-1 block">Date (e.g. 30 May)</label><input type="text" id="e-date" value="${data.date}"></div>
                            <div class="md:col-span-2"><label class="text-xs text-sky-300 font-semibold mb-1 block">Sleep (ที่พัก)</label><input type="text" id="e-sleep" value="${data.sleep}"></div>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                            <div><label class="text-xs text-sky-300 font-semibold mb-1 block">Weather Icon</label><input type="text" id="e-w-icon" value="${data.weather.icon}"></div>
                            <div><label class="text-xs text-sky-300 font-semibold mb-1 block">Temp</label><input type="text" id="e-w-temp" value="${data.weather.temp}"></div>
                            <div><label class="text-xs text-sky-300 font-semibold mb-1 block">Description</label><input type="text" id="e-w-desc" value="${data.weather.desc}"></div>
                        </div>

                        <div class="mb-5"><label class="text-xs text-sky-300 font-semibold mb-1 block">OOTD</label><input type="text" id="e-ootd" value="${data.ootd}"></div>
                        <div class="mb-8"><label class="text-xs text-sky-300 font-semibold mb-1 block">Target Food</label><input type="text" id="e-food" value="${data.food}"></div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-700 shadow-inner">
                                <label class="text-sm font-bold text-indigo-400 mb-3 block border-b border-slate-700 pb-2">Missions</label>
                                <div id="edit-missions-list">${activitiesEdit}</div>
                                <button onclick="addMission()" class="mt-3 text-sm bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg w-full font-semibold transition-colors">+ Add Mission</button>
                            </div>
                            <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-700 shadow-inner">
                                <label class="text-sm font-bold text-sky-400 mb-3 block border-b border-slate-700 pb-2">GPS / Mapcode</label>
                                <div id="edit-navi-list">${naviEdit}</div>
                                <button onclick="addNavi()" class="mt-3 text-sm bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-lg w-full font-semibold transition-colors">+ Add GPS</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Tabs Update
            tabsContainer.innerHTML = '';
            tripData.forEach((d, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn snap-center whitespace-nowrap px-6 py-3 rounded-xl border-2 text-sm font-bold transition-all ${idx === dayIndex ? 'bg-sky-600 text-white border-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.4)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700 hover:text-slate-200'}`;
                btn.innerText = d.day;
                btn.onclick = () => {
                    if (isEditMode) saveCurrentView();
                    renderContent(idx);
                };
                tabsContainer.appendChild(btn);
            });
        }

        // 6. Action Helpers
        window.addMission = () => { saveCurrentView(); tripData[currentDayIndex].activities.push(""); renderContent(currentDayIndex); }
        window.removeMission = (idx) => { saveCurrentView(); tripData[currentDayIndex].activities.splice(idx, 1); renderContent(currentDayIndex); }
        window.addNavi = () => { saveCurrentView(); tripData[currentDayIndex].navi.push({name:"", code:""}); renderContent(currentDayIndex); }
        window.removeNavi = (idx) => { saveCurrentView(); tripData[currentDayIndex].navi.splice(idx, 1); renderContent(currentDayIndex); }

        // 7. Edit Toggle
        document.getElementById('btn-edit').addEventListener('click', () => {
            if (isEditMode) {
                saveCurrentView();
                document.getElementById('btn-edit').innerHTML = "⚙️";
                document.getElementById('btn-edit').classList.replace('bg-pink-600', 'bg-blue-600');
                document.getElementById('btn-edit').classList.replace('hover:bg-pink-500', 'hover:bg-blue-500');
            } else {
                document.getElementById('btn-edit').innerHTML = "💾";
                document.getElementById('btn-edit').classList.replace('bg-blue-600', 'bg-pink-600');
                document.getElementById('btn-edit').classList.replace('hover:bg-blue-500', 'hover:bg-pink-500');
            }
            isEditMode = !isEditMode;
            renderHeader();
            renderContent(currentDayIndex);
        });

        // 8. Export Hack
        document.getElementById('btn-export').addEventListener('click', () => {
            saveCurrentView();
            const exportText = `const defaultTripMeta = ${JSON.stringify(tripMeta, null, 4)};\nconst defaultTripData = ${JSON.stringify(tripData, null, 4)};`;
            navigator.clipboard.writeText(exportText).then(() => {
                alert("✅ Success!\n\nก๊อปปี้ข้อมูล Trip Data ชุดใหม่ (9 วันเต็ม) ลง Clipboard เรียบร้อยแล้ว!\nนำไปวางทับโค้ดก้อนเดิมในไฟล์ HTML เพื่ออัปเดตถาวรได้เลย Bro!");
            }).catch(err => {
                alert("❌ Failed to copy. Your browser might block it.");
            });
        });

        // Initialize
        renderHeader();
        renderContent(0);
    </script>
</body>
</html>
